<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recly — Auto Edit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121214}
a{color:#EDEBE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
.btn{transition:transform .12s ease,border-color .2s,background .2s}
.btn:hover{transform:translateY(-2px);border-color:#4A4A50}
.btn:active{transform:translateY(1px)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes scan{0%{top:-4px}100%{top:100%}}
@keyframes stamp{0%{opacity:0;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
.grow{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.scan{position:absolute;left:0;right:0;height:3px;background:#FF5A36;box-shadow:0 0 0 1px rgba(0,0,0,.4);animation:scan 1.8s ease-in-out infinite alternate}
.stamp{animation:stamp .4s cubic-bezier(.2,.8,.2,1) .9s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121214; color: #EDEBE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 12px 8px">
    <a href="Editor.dc.html" aria-label="Voltar ao editor" class="btn" style="width: 44px; height: 44px; border-radius: 12px; background: #1C1C1F; border: 1.5px solid #2C2C30; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEBE6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">Auto Edit</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 16px">

    <section class="rise" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #1C1C1F; border: 1.5px solid #2C2C30">
      <div style="width: 56px; height: 96px; border-radius: 8px; background: #2E2B34; border: 1.5px solid #2C2C30; box-sizing: border-box; position: relative; overflow: hidden; flex-shrink: 0">
        <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.07) 1.2px, transparent 1.4px); background-size: 8px 8px"></div>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #7F92B8">Referência</span>
        <span style="font-size: 15px; font-weight: 600">[nome do vídeo de referência]</span>
        <span style="font-size: 12px; color: #9A968C">Lendo cortes, legendas e ritmo…</span>
      </div>
      <button class="btn" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #2C2C30; background: #121214; color: #EDEBE6; font-size: 13px; font-weight: 600">Trocar</button>
    </section>

    <section class="rise d1" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Por que esse vídeo vende</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{signals}}" as="s" hint-placeholder-count="4">
          <div class="btn" style="padding: 12px; border-radius: 12px; background: #1C1C1F; border: 1.5px solid #2C2C30; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: #9A968C">{{s.label}}</span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: {{s.fg}}">{{s.value}}</span>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
              <sc-for list="{{s.bars}}" as="b" hint-placeholder-count="3">
                <div class="grow" style="height: 5px; border-radius: 3px; background: {{b.c}}; animation-delay: {{b.d}}"></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="padding: 12px; border-radius: 12px; background: #1C1C1F; border: 1.5px solid #2C2C30; display: flex; flex-direction: column; gap: 10px; position: relative">
        <span style="font-size: 12px; color: #9A968C">Estrutura do vídeo</span>
        <div style="display: flex; gap: 3px; height: 30px">
          <sc-for list="{{structure}}" as="p" hint-placeholder-count="4">
            <div class="grow" style="animation-delay: {{p.d}}; flex: {{p.flex}}; border-radius: 6px; background: {{p.bg}}; color: {{p.fg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.name}}</div>
          </sc-for>
        </div>
        <span class="stamp" style="position: absolute; right: 10px; top: 10px; padding: 2px 7px; border-radius: 5px; background: rgba(255,90,54,0.16); border: 1px solid #FF5A36; color: #FF8C70; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em">CTA fraco</span>
      </div>
    </section>

    <section class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Preset</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
          <button class="btn" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid {{p.line}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 600">{{p.name}}</button>
        </sc-for>
      </div>
    </section>

    <section class="rise d3" style="display: flex; flex-direction: column; border-radius: 12px; background: #1C1C1F; border: 1.5px solid #2C2C30; overflow: hidden">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <label style="min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; border-bottom: {{o.line}}; cursor: pointer">
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 600">{{o.name}}</span>
            <span style="font-size: 12px; color: #9A968C">{{o.hint}}</span>
          </span>
          <input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 22px; height: 22px; accent-color: {{accent}}">
        </label>
      </sc-for>
    </section>
  </main>

  <div style="padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid #2C2C30; background: #121214">
    <a href="Editor.dc.html" class="btn" style="height: 52px; border-radius: 12px; background: {{accent}}; border: 1.5px solid {{accent}}; color: #141414; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#141414" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      <span style="color: #141414">Montar minha edição</span>
    </a>
    <span style="font-size: 12px; color: #9A968C; text-align: center">Sai como projeto editável — nada é renderizado até exportar.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#FFD23F","#7F92B8","#EDEBE6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { preset: 'produto', opts: { silencio: true, legendas: true, zoom: false } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    const lvl = (n, k, col) => [0, 1, 2].map((i) => ({
      c: i < n ? col : '#2C2C30',
      d: (0.3 + k * 0.1 + i * 0.12).toFixed(2) + 's'
    }));
    const presetDefs = [
      { id: 'produto', name: 'Review de produto' },
      { id: 'tutorial', name: 'Tutorial' },
      { id: 'depoimento', name: 'Depoimento' },
      { id: 'referencia', name: 'Igual à referência' }
    ];
    const presets = presetDefs.map((p) => {
      const on = this.state.preset === p.id;
      return {
        ...p,
        pressed: on ? 'true' : 'false',
        bg: on ? '#4F6290' : '#1C1C1F',
        line: on ? '#7F92B8' : '#2C2C30',
        fg: on ? '#FFFFFF' : '#EDEBE6',
        pick: () => this.setState({ preset: p.id })
      };
    });
    const optDefs = [
      { id: 'silencio', name: 'Cortar silêncios', hint: 'Tira pausas e respirações longas' },
      { id: 'legendas', name: 'Legendas automáticas', hint: 'Usa o estilo de legenda do editor' },
      { id: 'zoom', name: 'Zoom nos destaques', hint: 'Keyframes de zoom nas falas-chave' }
    ];
    const options = optDefs.map((o, i) => ({
      ...o,
      line: i < optDefs.length - 1 ? '1.5px solid #2C2C30' : '0',
      on: !!this.state.opts[o.id],
      toggle: () => this.setState({ opts: { ...this.state.opts, [o.id]: !this.state.opts[o.id] } })
    }));
    return {
      accent,
      signals: [
        { label: 'Gancho (0–3 s)', value: 'Forte', fg: '#EDEBE6', bars: lvl(3, 0, '#7F92B8') },
        { label: 'Ritmo de cortes', value: 'Rápido', fg: '#EDEBE6', bars: lvl(3, 1, '#7F92B8') },
        { label: 'Legenda na tela', value: 'Sempre', fg: '#FFD23F', bars: lvl(2, 2, '#FFD23F') },
        { label: 'Chamada final', value: 'Fraca', fg: '#FF8C70', bars: lvl(1, 3, '#FF5A36') }
      ],
      structure: [
        { name: 'Gancho', flex: 1, bg: '#7F92B8', fg: '#141414', d: '0.5s' },
        { name: 'Problema', flex: 2, bg: '#2C2C30', fg: '#EDEBE6', d: '0.62s' },
        { name: 'Demo', flex: 3, bg: '#4F6290', fg: '#FFFFFF', d: '0.74s' },
        { name: 'CTA', flex: 1, bg: '#FF5A36', fg: '#141414', d: '0.86s' }
      ],
      presets,
      options
    };
  }
}
</script>
</body>
</html>
