<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recly — Início</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121214}
a{color:#EDEBE6;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
.btn{transition:transform .12s ease,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:#4A4A50}
.btn:active{transform:translateY(1px)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121214; color: #EDEBE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v14"></path><path d="M11 8l8 4-8 4z" fill="#141414"></path></svg>
    </div>
    <button class="btn" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #2C2C30; background: #1C1C1F; color: #EDEBE6; font-weight: 700; font-size: 16px">M</button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 class="rise" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.04; letter-spacing: -0.03em">O que vamos <span style="color: #FFD23F">editar</span> hoje?</h1>

    <div class="rise d1" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Editor.dc.html" class="btn" style="height: 118px; border-radius: 14px; background: {{accent}}; border: 1.5px solid {{accent}}; color: #141414; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <span style="width: 38px; height: 38px; border-radius: 19px; background: #141414; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEBE6" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.05; color: #141414">Novo<br>projeto</span>
      </a>
      <a href="AutoEdit.dc.html" class="btn" style="height: 118px; border-radius: 14px; background: #4F6290; border: 1.5px solid #4F6290; color: #FFFFFF; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <span style="width: 38px; height: 38px; border-radius: 19px; background: #141414; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFD23F" stroke="#FFD23F" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        </span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.05; color: #FFFFFF">Auto<br>Edit</span>
      </a>
    </div>

    <section class="rise d2 btn" style="border-radius: 14px; background: #1C1C1F; border: 1.5px solid #2C2C30; padding: 14px; display: flex; gap: 12px; align-items: center">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: #121214; border: 1.5px solid #2C2C30; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding-bottom: 10px; box-sizing: border-box">
        <span style="width: 6px; height: 12px; background: #FF5A36; border-radius: 2px"></span>
        <span style="width: 6px; height: 22px; background: #7F92B8; border-radius: 2px"></span>
        <span style="width: 6px; height: 16px; background: #FFD23F; border-radius: 2px"></span>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 15px">Analisar vídeo que vende</span>
        <span style="font-size: 13px; line-height: 1.35; color: #9A968C">Descubra o gancho, o ritmo e o que segura quem assiste.</span>
      </div>
      <a href="AutoEdit.dc.html" aria-label="Abrir análise" style="width: 44px; height: 44px; border-radius: 22px; background: #2C2C30; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEBE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section class="rise d3" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Recentes</h2>
        <a href="#" style="font-size: 14px; font-weight: 600; color: #9A968C">Ver todos</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
          <a href="Editor.dc.html" style="display: flex; flex-direction: column; gap: 6px">
            <div class="btn" style="height: 132px; border-radius: 12px; background: {{p.tone}}; border: 1.5px solid #2C2C30; position: relative; overflow: hidden">
              <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.06) 1.2px, transparent 1.4px); background-size: 10px 10px"></div>
              <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border-radius: 18px; background: rgba(18,18,20,0.8); border: 1.5px solid #4A4A50; display: flex; align-items: center; justify-content: center">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="#EDEBE6" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
              </span>
              <span style="position: absolute; left: 7px; bottom: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: rgba(18,18,20,0.85); color: #EDEBE6">{{p.dur}}</span>
              <span style="position: absolute; right: 7px; top: 7px; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: rgba(18,18,20,0.85); color: #EDEBE6">{{p.format}}</span>
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.08)"><div style="width: {{p.progress}}; height: 3px; background: {{p.bar}}"></div></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
              <span style="font-size: 12px; color: #9A968C">{{p.when}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Navegação principal" style="display: flex; justify-content: space-around; padding: 10px 12px 20px; border-top: 1.5px solid #2C2C30; background: #121214">
    <a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; background: #EDEBE6; color: #141414; font-size: 13px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Projetos
    </a>
    <a href="#" aria-label="Presets" style="width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; color: #9A968C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg>
    </a>
    <a href="#" aria-label="Ajustes" style="width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; color: #9A968C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#FFD23F","#7F92B8","#EDEBE6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    return {
      accent,
      projects: [
        { name: 'Review fone bluetooth', when: 'Editado há 2 h', dur: '00:42', format: '9:16', tone: '#2A2D35', progress: '70%', bar: accent },
        { name: 'Unboxing tênis', when: 'Ontem', dur: '01:15', format: '9:16', tone: '#332D28', progress: '35%', bar: '#FFD23F' },
        { name: 'Receita em 30 s', when: '3 dias atrás', dur: '00:30', format: '1:1', tone: '#2A2F2B', progress: '100%', bar: '#7F92B8' },
        { name: 'Tutorial do app', when: 'Semana passada', dur: '02:08', format: '16:9', tone: '#2E2B34', progress: '15%', bar: accent }
      ]
    };
  }
}
</script>
</body>
</html>
